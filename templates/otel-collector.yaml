apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  # The operator appends "-collector": the DaemonSet, pods and Service are named otel-collector.
  name: otel
  namespace: glueops-core-monitoring
spec:
  mode: daemonset
  # Requests take the agent out of BestEffort QoS (first to be evicted / OOM-killed under node pressure). Only memory is
  # limited: memory_limiter's limit_percentage is computed from the container memory limit (without one it would be a
  # percentage of the whole node), and no CPU limit so the agent isn't throttled into dropping data.
  resources:
    requests:
      cpu: {{ .Values.collector.resources.requests.cpu }}
      memory: {{ .Values.collector.resources.requests.memory }}
    limits:
      memory: {{ .Values.collector.memoryLimitMiB }}Mi
  env:
    # 80% of the memory limit, as recommended upstream. The operator would otherwise set GOMEMLIMIT to 100% of the
    # limit; a GOMEMLIMIT in spec.env takes precedence over the operator's.
    - name: GOMEMLIMIT
      value: {{ div (mul .Values.collector.memoryLimitMiB 80) 100 }}MiB
  volumes:
   - name: varlog
     hostPath:
        path: /var/log
  volumeMounts:
    - mountPath: /var/log
      name: varlog
      readOnly: true
  config:
    # Component types use the new upstream names (file_log, otlp_grpc, otlp_http, span_metrics); the old ones are only
    # deprecated aliases. prometheusremotewrite keeps its old name: prometheus_remote_write needs collector >= 0.163.
    receivers:
      file_log/multilang:
        include:
          - /var/log/pods/*/*/*.log
        include_file_name: false
        include_file_path: true
        operators:
          - parse_from: attributes["log.file.path"]
            regex: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_[^/]+/(?P<container_name>[^/]+)/[^/]+\.log'
            type: regex_parser
          # resource attribute (not a log attribute) so Loki's OTLP ingestion promotes it to the k8s_namespace_name
          # stream label, like k8s.pod.name / k8s.container.name below.
          - from: attributes["namespace"]
            to: resource["k8s.namespace.name"]
            type: copy
          - from: attributes["pod_name"]
            to: resource["k8s.pod.name"]
            type: copy
          - from: attributes["container_name"]
            to: resource["k8s.container.name"]
            type: copy
          - parse_from: attributes["pod_name"]
            regex: '^(?P<service_prefix>.+?)(-[0-9a-f]{9,}(-[a-z0-9]{4,})?|-[0-9]+|-[a-z0-9]{4,6})?$'
            type: regex_parser
          - from: attributes["service_prefix"]
            to: resource["service.name"]
            type: copy
        poll_interval: 200ms
        start_at: end
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            cors:
              allowed_origins:
                - http://*
                - https://*
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector
              scrape_interval: 5s
              static_configs:
                - targets:
                    - 0.0.0.0:8888
    exporters:
      otlp_grpc/trace:
        endpoint: glueops-core-tempo-distributor.glueops-core-monitoring:4317
        headers:
          X-Scope-OrgID: "{{ .Values.captain_domain }}"
        tls:
          insecure: true
      otlp_http/loki:
        headers:
          X-Scope-OrgID: "{{ .Values.captain_domain }}"
        logs_endpoint: http://loki-write-headless.glueops-core-monitoring:3100/otlp/v1/logs
      prometheusremotewrite:
        endpoint: http://glueops-core-kps-prometheus.glueops-core-monitoring:9090/api/v1/write
        target_info:
          enabled: true
    processors:
      batch:
        send_batch_max_size: 2048
        send_batch_size: 1024
        timeout: 1s
      # Percentages of the container memory limit: with 512Mi, hard limit ~409Mi (data refused + forced GC) and soft
      # limit ~281Mi (hard minus the 25% spike: data refused with retryable errors).
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
    connectors:
      span_metrics:
        aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
        dimensions:
          - default: GET
            name: http.method
          - name: http.status_code
          - name: http.target
          - name: net.peer.ip
          - name: http.client_ip
        exemplars:
          enabled: true
        metrics_expiration: 5m
        metrics_flush_interval: 15s
        namespace: span.metrics
        resource_metrics_key_attributes:
          - service.name
          - telemetry.sdk.language
          - telemetry.sdk.name
        # Circuit breaker on unique dimension combinations, per service (resource_metrics_key_attributes) and per
        # collector pod (DaemonSet); combinations past it are folded into one series with otel.metric.overflow="true".
        # Replaces the deprecated dimensions_cache_size.
        aggregation_cardinality_limit: {{ .Values.collector.spanmetrics.aggregationCardinalityLimit }}
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp_http/loki
          receivers:
            - otlp
            - file_log/multilang
        metrics:
          processors:
            - memory_limiter
            - batch
          exporters:
            - prometheusremotewrite
          receivers:
            # otlp must be listed here too: a receiver only serves the signals of the pipelines that reference it,
            # so without it the collector answers OTLP metric exports with gRPC Unimplemented / HTTP 404.
            - otlp
            - prometheus
            - span_metrics
        traces:
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp_grpc/trace
            - span_metrics
          receivers:
            - otlp

---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: glueops-instrumentation
  namespace: glueops-core-monitoring
spec:
  exporter:
    endpoint: http://otel-collector.glueops-core-monitoring.svc.cluster.local:4318
  env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    # Pod stdout already reaches Loki via the filelog receiver; OTLP logs would duplicate every line.
    - name: OTEL_LOGS_EXPORTER
      value: none
  # The Apache/nginx webserver module only has an OTLP/gRPC exporter, so it keeps the gRPC port.
  apacheHttpd:
    attrs:
      - name: ApacheModuleOtelExporterEndpoint
        value: http://otel-collector.glueops-core-monitoring.svc.cluster.local:4317
  nginx:
    attrs:
      - name: NginxModuleOtelExporterEndpoint
        value: http://otel-collector.glueops-core-monitoring.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_always_on
---
# Old Service name, kept so pods injected before the rename (their endpoint env is fixed at pod creation) and workloads
# that hard-code it keep exporting. Remove once nothing uses otel-collector-collector.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-collector
  namespace: glueops-core-monitoring
spec:
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: glueops-core-monitoring.otel
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/part-of: opentelemetry
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: glueops-core-monitoring
spec:
  mode: daemonset
  # Requests take the agent out of BestEffort QoS (first to be evicted / OOM-killed under node pressure). Only memory is
  # limited: memory_limiter's limit_percentage is computed from the container memory limit (without one it would be a
  # percentage of the whole node), and no CPU limit so the agent isn't throttled into dropping data.
  resources:
    requests:
      cpu: {{ .Values.collector.resources.requests.cpu }}
      memory: {{ .Values.collector.resources.requests.memory }}
    limits:
      memory: {{ .Values.collector.memoryLimitMiB }}Mi
  env:
    # 80% of the memory limit, as recommended upstream. The operator would otherwise set GOMEMLIMIT to 100% of the
    # limit; a GOMEMLIMIT in spec.env takes precedence over the operator's.
    - name: GOMEMLIMIT
      value: {{ div (mul .Values.collector.memoryLimitMiB 80) 100 }}MiB
  volumes:
   - name: varlog
     hostPath:
        path: /var/log
  volumeMounts:
    - mountPath: /var/log
      name: varlog
      readOnly: true
  config:
    # Component types use the new upstream names (file_log, otlp_grpc, otlp_http, span_metrics); the old ones are only
    # deprecated aliases. prometheusremotewrite keeps its old name: prometheus_remote_write needs collector >= 0.163.
    receivers:
      file_log/multilang:
        include:
          - /var/log/pods/*/*/*.log
        include_file_name: false
        include_file_path: true
        operators:
          - parse_from: attributes["log.file.path"]
            regex: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_[^/]+/(?P<container_name>[^/]+)/[^/]+\.log'
            type: regex_parser
          # resource attribute (not a log attribute) so Loki's OTLP ingestion promotes it to the k8s_namespace_name
          # stream label, like k8s.pod.name / k8s.container.name below.
          - from: attributes["namespace"]
            to: resource["k8s.namespace.name"]
            type: copy
          - from: attributes["pod_name"]
            to: resource["k8s.pod.name"]
            type: copy
          - from: attributes["container_name"]
            to: resource["k8s.container.name"]
            type: copy
          - parse_from: attributes["pod_name"]
            regex: '^(?P<service_prefix>.+?)(-[0-9a-f]{9,}(-[a-z0-9]{4,})?|-[0-9]+|-[a-z0-9]{4,6})?$'
            type: regex_parser
          - from: attributes["service_prefix"]
            to: resource["service.name"]
            type: copy
        poll_interval: 200ms
        start_at: end
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            cors:
              allowed_origins:
                - http://*
                - https://*
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector
              scrape_interval: 5s
              static_configs:
                - targets:
                    - 0.0.0.0:8888
    exporters:
      otlp_grpc/trace:
        endpoint: glueops-core-tempo-distributor.glueops-core-monitoring:4317
        headers:
          X-Scope-OrgID: "{{ .Values.captain_domain }}"
        tls:
          insecure: true
      otlp_http/loki:
        headers:
          X-Scope-OrgID: "{{ .Values.captain_domain }}"
        logs_endpoint: http://loki-write-headless.glueops-core-monitoring:3100/otlp/v1/logs
      # One exporter per Prometheus replica, addressed through the operator's headless Service: the shared ClusterIP
      # Service would balance per connection and leave each replica with only part of the data.
      {{- range $i, $endpoint := .Values.collector.remoteWriteEndpoints }}
      prometheusremotewrite/{{ $i }}:
        endpoint: {{ $endpoint }}
        target_info:
          enabled: true
      {{- end }}
    processors:
      batch:
        send_batch_max_size: 2048
        send_batch_size: 1024
        timeout: 1s
      # Percentages of the container memory limit: with 512Mi, hard limit ~409Mi (data refused + forced GC) and soft
      # limit ~281Mi (hard minus the 25% spike: data refused with retryable errors).
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Guards against cardinality bugs in tenant apps (OTLP metrics only). Data points carrying an ID- or URL-like
      # attribute are dropped instead of having the attribute deleted: deleting it would collapse distinct series into
      # duplicates with wrong values. The other data points of the same app and metric still go through.
      transform/cardinality:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(cache["attributes"], Len(attributes))
              - delete_matching_keys(attributes, {{ .Values.collector.cardinalityGuard.dropAttributeKeysRegex | quote }})
              - set(attributes["glueops.cardinality_guard"], "drop") where Len(attributes) < cache["attributes"]
              - truncate_all(attributes, {{ .Values.collector.cardinalityGuard.maxAttributeValueLength }})
      filter/cardinality:
        error_mode: ignore
        metrics:
          datapoint:
            - attributes["glueops.cardinality_guard"] != nil
            - Len(attributes) > {{ .Values.collector.cardinalityGuard.maxAttributes }}
    connectors:
      span_metrics:
        aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
        dimensions:
          - default: GET
            name: http.method
          - name: http.status_code
          - name: http.target
          - name: net.peer.ip
          - name: http.client_ip
        exemplars:
          enabled: true
        # metrics_expiration drops a whole service after it sends no spans; series_expiration drops single combinations.
        metrics_expiration: 5m
        series_expiration: {{ .Values.collector.spanmetrics.seriesExpiration }}
        metrics_flush_interval: 15s
        namespace: span.metrics
        resource_metrics_key_attributes:
          - service.name
          - telemetry.sdk.language
          - telemetry.sdk.name
        # Circuit breaker on unique dimension combinations, per service (resource_metrics_key_attributes) and per
        # collector pod (DaemonSet); combinations past it are folded into one series with otel.metric.overflow="true".
        # Replaces the deprecated dimensions_cache_size.
        aggregation_cardinality_limit: {{ .Values.collector.spanmetrics.aggregationCardinalityLimit }}
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp_http/loki
          receivers:
            - otlp
            - file_log/multilang
        # Metrics sent by apps. The otlp receiver must be in a metrics pipeline: a receiver only serves the signals of
        # the pipelines that reference it, so without it the collector answers OTLP metric exports with gRPC
        # Unimplemented / HTTP 404.
        metrics/otlp:
          processors:
            - memory_limiter
            - transform/cardinality
            - filter/cardinality
            - batch
          exporters:
            {{- range $i, $_ := .Values.collector.remoteWriteEndpoints }}
            - prometheusremotewrite/{{ $i }}
            {{- end }}
          receivers:
            - otlp
        # The collector's own metrics and the span metrics (bounded by span_metrics.aggregation_cardinality_limit).
        metrics:
          processors:
            - memory_limiter
            - batch
          exporters:
            {{- range $i, $_ := .Values.collector.remoteWriteEndpoints }}
            - prometheusremotewrite/{{ $i }}
            {{- end }}
          receivers:
            - prometheus
            - span_metrics
        traces:
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp_grpc/trace
            - span_metrics
          receivers:
            - otlp

---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: glueops-instrumentation
  namespace: glueops-core-monitoring
spec:
  exporter:
    endpoint: http://otel-collector-collector.glueops-core-monitoring.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_always_on